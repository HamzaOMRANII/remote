# remote.omranisystems.com  ->  app on 127.0.0.1:16010
# Included inside http{} via `include /etc/nginx/conf.d/*.conf;`, so it inherits
# the wildcard Cloudflare origin cert and the $connection_upgrade map.
#
# Auth: the Remote app provides its own password login + a token-authed agent
# WebSocket (/agent). /healthz is reachable without login for uptime checks.
# WebSocket upgrades (/ws viewers, /agent agents) are proxied via the shared
# $connection_upgrade map.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name remote.omranisystems.com;

    location / {
        proxy_pass http://127.0.0.1:16010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # WebRTC signaling + future long-lived WS: keep upgraded sockets open
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
